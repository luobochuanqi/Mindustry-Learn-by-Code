name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Verify Datagen Freshness
      run: |
        ./gradlew runData --no-daemon
        # 产物过期(生成物与入库不一致)则失败;.cache 为 datagen 内部缓存,跨平台哈希可能抖动,不参与校验
        git diff --exit-code -- src/generated/resources/assets \
          || (echo "::error::datagen 产物过期:请本地运行 ./gradlew runData 并提交更新后的产物" && exit 1)

    - name: Build
      run: ./gradlew build --no-daemon

    - name: Upload mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: mturrets
        path: build/libs/*.jar
        retention-days: 7