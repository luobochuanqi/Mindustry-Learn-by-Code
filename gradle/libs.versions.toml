[versions]
# Minecraft / NeoForge 平台
minecraft = "1.21.1"
neoForge = "21.1.248"
parchmentMinecraft = "1.21.1"
parchmentMappings = "2024.11.17"

# 构建插件
moddev = "2.0.144"
kotlin = "2.4.10"

# 运行时依赖(最小依赖集)
kotlinForForge = "5.12.0"
flywheel = "1.0.6"
jade = "15.10.6+neoforge"
jei = "19.50.0.414"

[libraries]
# 运行时依赖
kotlinforforge = { module = "thedarkcolour:kotlinforforge-neoforge", version.ref = "kotlinForForge" }
# Flywheel 分 api/runtime 两个 artifact;Minecraft 版本在 artifact 名里
flywheel-api = { module = "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1", version.ref = "flywheel" }
flywheel = { module = "dev.engine-room.flywheel:flywheel-neoforge-1.21.1", version.ref = "flywheel" }
jade = { module = "maven.modrinth:jade", version.ref = "jade" }
# JEI:仅 dev 运行时辅助调试(配方/物品浏览)
jei = { module = "mezz.jei:jei-1.21.1-neoforge", version.ref = "jei" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
