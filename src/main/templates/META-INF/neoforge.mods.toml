modLoader = "kotlinforforge"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
#issueTrackerURL="https://github.com/luobochuanqi/MTurrets/issues"

# 客户端 mixin:多方块破坏裂纹代理(#42)
[[mixins]]
config = "mturrets.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# 最小依赖集:NeoForge / Minecraft / KotlinForForge / Flywheel / Jade

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "kotlinforforge"
type = "required"
versionRange = "${loader_version_range}"
ordering = "NONE"
side = "BOTH"

# Flywheel 仅客户端渲染需要;ordering AFTER 保证实例类型注册前其后端已就绪
[[dependencies."${mod_id}"]]
modId = "flywheel"
type = "required"
versionRange = "${flywheel_version_range}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "jade"
type = "required"
versionRange = "${jade_version_range}"
ordering = "NONE"
side = "BOTH"